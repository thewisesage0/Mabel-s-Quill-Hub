<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Showcase</title>
  <style>
    :root {
      font-family: Inter, system-ui, sans-serif;
      color: #f6e5ff;
      background: #09040f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 44px;
      background: radial-gradient(circle at top left, rgba(255, 100, 220, 0.16), transparent 18%),
        radial-gradient(circle at bottom right, rgba(255, 140, 220, 0.12), transparent 20%),
        linear-gradient(180deg, #07030b 0%, #120818 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 30% 18%, rgba(255, 90, 215, 0.24), transparent 15%),
        radial-gradient(circle at 80% 32%, rgba(255, 140, 218, 0.18), transparent 12%);
      pointer-events: none;
      z-index: -1;
    }

    .page-header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 40px;
      position: relative;
      z-index: 1;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(2.7rem, 5vw, 4.4rem);
      letter-spacing: -0.05em;
      text-transform: uppercase;
      color: #ffd7ff;
      text-shadow: 0 0 32px rgba(255, 129, 231, 0.25);
    }

    .page-header p {
      margin: 18px auto 0;
      max-width: 720px;
      color: #d8c7e9;
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .grid {
      display: grid;
      gap: 30px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      max-width: 1320px;
      margin: 0 auto;
    }

    .card {
      background: rgba(20, 11, 30, 0.92);
      border: 1px solid rgba(255, 96, 214, 0.15);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 34px 80px rgba(0, 0, 0, 0.25);
      transform: translateY(24px);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    .card:nth-child(1) { animation-delay: 0.08s; }
    .card:nth-child(2) { animation-delay: 0.16s; }
    .card:nth-child(3) { animation-delay: 0.24s; }
    .card:nth-child(4) { animation-delay: 0.32s; }
    .card:nth-child(5) { animation-delay: 0.40s; }
    .card:nth-child(6) { animation-delay: 0.48s; }

    .image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 120, 210, 0.12), rgba(255, 255, 255, 0.04));
    }

    .image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(255, 40, 180, 0.1), transparent 70%);
      pointer-events: none;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s ease;
      will-change: transform;
    }

    .card:hover img {
      transform: scale(1.08) rotate(0.2deg);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 100, 220, 0.45);
      box-shadow: 0 42px 120px rgba(255, 64, 180, 0.18);
    }

    .card-body {
      padding: 24px 26px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      margin: 0;
      color: #fff;
      font-size: 1.06rem;
      letter-spacing: 0.01em;
    }

    .card-text {
      margin: 0;
      color: #c9b7e3;
      line-height: 1.75;
      font-size: 0.98rem;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      width: fit-content;
      background: linear-gradient(135deg, #ff78e0 0%, #ff44bd 100%);
      color: #10041b;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 18px 40px rgba(255, 74, 190, 0.22);
    }

    .download-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 55px rgba(255, 96, 210, 0.28);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 24px;
      }

      .grid {
        gap: 22px;
      }

      .card-body {
        padding: 20px;
      }
    }
  </style>
</head>
